name: Build and verify Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0', cache: npm}
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: sudo apt-get install -y libgtk-3-0
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run provision && npm run verify:runtime
      - run: npm run test:integration
      - run: npm run build
      - run: xvfb-run -a npm run test:desktop
  windows-installer:
    runs-on: windows-latest
    needs: linux-checks
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.22.0', cache: npm}
      - run: npm ci
      - run: npm run provision
      - run: npm run verify:runtime
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Install the actual setup executable and smoke-test the installed application
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/Phantom-Browser-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw 'Setup EXE missing' }
          $install = Join-Path $env:RUNNER_TEMP 'PhantomInstalled'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PHANTOM_INSTALLED_EXE = Join-Path $install 'Phantom Browser.exe'
          if (!(Test-Path $env:PHANTOM_INSTALLED_EXE)) { throw 'Installed executable missing' }
          npx playwright test tests/installed.integration.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release/Phantom-Browser-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "release/$($_.Name).sha256"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Phantom-Browser-Windows-Setup
          path: |
            release/Phantom-Browser-Setup-*.exe
            release/*.sha256
          if-no-files-found: error
      - name: Publish tested installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-build.${{ github.run_number }}"
          gh release create $tag release/Phantom-Browser-Setup-*.exe release/*.sha256 --target "${{ github.sha }}" --title 'Phantom Browser — Windows Setup' --notes 'Windows x64 setup with bundled Chromium. No Node.js or separate browser installation required. Unsigned: Windows SmartScreen may warn. Build passed Linux checks, Windows browser and DPAPI tests, and installed-application smoke test. Backups are not encrypted; protect session data.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
