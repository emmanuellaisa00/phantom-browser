name: CI
on: [push, pull_request]
jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x, cache: npm }
      - run: sudo npx playwright install-deps chromium
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: xvfb-run -a npm run test:desktop
      - run: npm run provision && npm run verify:runtime && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: renderer-build, path: app/ }

  windows-installer:
    runs-on: windows-latest
    needs: linux-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x, cache: npm }
      - run: npm ci
      - run: npm run provision
      - run: npm run verify:runtime
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: release/ }

